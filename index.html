<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Kzin Cheat - Enterprise Control System v6.4 (Trillion-Dollar Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #020305;
            --bg-card: #070913;
            --bg-card-hover: #0c1021;
            --border: #18203d;
            --cyan: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.4);
            --purple: #7928ca;
            --purple-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7928ca 100%);
            --danger: #ff0055;
            --warning: #ffb700;
            --success: #00ff88;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            min-width: 1280px;
            overflow-x: auto;
            position: relative;
        }

        /* Ambient Dynamic Background Animations */
        .ambient-glow-1 {
            position: fixed; top: -10%; left: 10%; width: 600px; height: 600px;
            background: rgba(0, 242, 254, 0.08); filter: blur(180px); border-radius: 50%; z-index: 0; pointer-events: none;
            animation: floatGlow 10s ease-in-out infinite alternate;
        }
        .ambient-glow-2 {
            position: fixed; bottom: -10%; right: 10%; width: 700px; height: 700px;
            background: rgba(121, 40, 202, 0.09); filter: blur(200px); border-radius: 50%; z-index: 0; pointer-events: none;
            animation: floatGlow 12s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatGlow { 0% { transform: scale(1) translateY(0); opacity: 0.7; } 100% { transform: scale(1.25) translateY(-30px); opacity: 1; } }

        /* Login Screen */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            background: rgba(2, 3, 5, 0.95); backdrop-filter: blur(25px); transition: opacity 0.6s ease;
        }
        .auth-container { position: relative; z-index: 2; text-align: center; width: 100%; max-width: 440px; padding: 20px; animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .brand-title {
            font-family: 'Orbitron', sans-serif; font-size: 40px; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(90deg, #fff 0%, var(--cyan) 50%, var(--purple) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }
        .brand-subtitle { font-size: 11px; letter-spacing: 5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 36px; }
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(0, 242, 254, 0.15); position: relative; overflow: hidden;
        }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--purple-gradient); }
        .auth-input {
            width: 100%; padding: 16px 20px; background: #030407; border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-main); font-size: 15px; text-align: center; letter-spacing: 2px; outline: none; margin-bottom: 24px; transition: var(--transition);
        }
        .auth-input:focus { border-color: var(--cyan); box-shadow: 0 0 25px var(--cyan-glow); }
        .btn-gradient {
            width: 100%; padding: 16px; background: var(--purple-gradient); border: none; border-radius: 12px;
            color: white; font-weight: 800; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; transition: var(--transition);
            box-shadow: 0 10px 25px rgba(121, 40, 202, 0.4);
        }
        .btn-gradient:hover { opacity: 0.95; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 242, 254, 0.4); }

        /* Dashboard Container */
        #dashboard-app { display: none; position: relative; z-index: 10; width: 1260px; margin: 0 auto; padding: 40px 20px; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .dash-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 35px; text-align: center; }
        .dash-brand {
            font-family: 'Orbitron', sans-serif; font-size: 44px; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(90deg, #fff 0%, var(--cyan) 50%, var(--purple) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.25));
        }
        .dash-sub { font-size: 11px; letter-spacing: 6px; color: var(--text-muted); text-transform: uppercase; margin-top: 8px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 28px; }
        .stat-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; text-align: center;
            transition: var(--transition); position: relative; overflow: hidden;
        }
        .stat-box::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); opacity: 0.3; transition: var(--transition); }
        .stat-box:hover { border-color: var(--cyan); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1); }
        .stat-box:hover::after { opacity: 1; height: 3px; }
        .stat-box .title { font-size: 10px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; margin-bottom: 8px; font-weight: 600; }
        .stat-box .value { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; color: #fff; }

        /* Navigation Bar */
        .navbar-dash {
            display: flex; justify-content: space-between; align-items: center; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 16px; padding: 14px 22px; margin-bottom: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-tabs { display: flex; gap: 10px; }
        .nav-tab {
            background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 12px 20px;
            border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: var(--transition); letter-spacing: 1px;
        }
        .nav-tab.active { background: rgba(0, 242, 254, 0.12); color: var(--cyan); border-color: rgba(0, 242, 254, 0.3); box-shadow: 0 0 15px rgba(0, 242, 254, 0.15); }
        .nav-actions { display: flex; gap: 10px; }
        .btn-action-sm {
            background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 12px 18px;
            border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: var(--transition); letter-spacing: 1px;
        }
        .btn-action-sm:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 242, 254, 0.05); }
        .btn-action-sm.logout { border-color: rgba(255, 0, 85, 0.4); color: var(--danger); }
        .btn-action-sm.logout:hover { background: rgba(255, 0, 85, 0.1); }

        .view-panel { display: none; animation: fadeIn 0.4s ease; }
        .view-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Key Generator Controls */
        .keygen-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px;
            display: grid; grid-template-columns: 90px 90px 1fr 110px 165px 155px 145px; gap: 16px; align-items: center; margin-bottom: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .keygen-control { display: flex; flex-direction: column; gap: 8px; }
        .keygen-control label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
        .keygen-control input, .keygen-control select {
            background: #030407; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); padding: 12px 14px; font-size: 13px; outline: none; transition: var(--transition);
        }
        .keygen-control input:focus, .keygen-control select:focus { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan-glow); }
        .btn-generate {
            background: var(--purple-gradient); border: none; border-radius: 10px; color: white; font-weight: 900; font-size: 12px;
            padding: 12px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; height: 46px; align-self: flex-end;
            transition: var(--transition); box-shadow: 0 8px 20px rgba(121, 40, 202, 0.4);
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 242, 254, 0.4); }

        /* Filter & Search Bar */
        .filter-bar {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px;
        }
        .search-input-box {
            flex-grow: 1; background: #030407; border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; color: var(--text-main); font-size: 14px; outline: none; transition: var(--transition);
        }
        .search-input-box:focus { border-color: var(--cyan); }
        .btn-wipe { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-wipe:hover { background: rgba(255, 0, 85, 0.1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }

        /* Data Table */
        .table-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow-x: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; white-space: nowrap; }
        th { color: var(--text-muted); font-weight: 700; padding: 18px 22px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; background: rgba(3, 4, 7, 0.7); }
        td { padding: 18px 22px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--bg-card-hover); }
        .key-text { font-family: 'Orbitron', monospace; color: var(--cyan); font-size: 12px; font-weight: 700; text-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        .badge-device { background: rgba(121, 40, 202, 0.2); color: #d8b4fe; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; border: 1px solid rgba(121, 40, 202, 0.3); }
        .badge-status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--success); box-shadow: 0 0 10px var(--success); }
        .btn-table { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-table:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 242, 254, 0.05); }
        .btn-table.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(255, 0, 85, 0.05); }

        /* Toast Notifications */
        #toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--bg-card); border: 1px solid var(--cyan);
            padding: 18px 28px; border-radius: 14px; display: none; z-index: 2000; font-size: 13px; font-weight: 700; color: var(--text-main); align-items: center; gap: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(0, 242, 254, 0.3); animation: slideInRight 0.4s ease;
        }
        @keyframes slideInRight { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body onload="checkAutoLogin()">

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Login Auth Screen -->
    <div id="auth-screen">
        <div class="auth-container">
            <div class="brand-title">KZIN CHEAT</div>
            <div class="brand-subtitle">Enterprise Control System v6.4</div>
            <div class="auth-card">
                <form onsubmit="handleLogin(event)">
                    <input type="password" id="access-code-input" class="auth-input" placeholder="ENTER ACCESS CODE" value="Kzin@Madhu" required>
                    <button type="submit" class="btn-gradient"><i class="fa-solid fa-shield-halved"></i> AUTHENTICATE CONSOLE</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-app">
        <header class="dash-header">
            <h1 class="dash-brand">KZIN CHEAT</h1>
            <p class="dash-sub">Trillion-Dollar Cloud Infrastructure // Turso DB Connected</p>
        </header>

        <div class="stats-grid">
            <div class="stat-box"><div class="title">Total Keys</div><div class="value" id="stat-total">0</div></div>
            <div class="stat-box"><div class="title">Valid Keys</div><div class="value" id="stat-active">0</div></div>
            <div class="stat-box"><div class="title">Frozen</div><div class="value">0</div></div>
            <div class="stat-box"><div class="title">Banned</div><div class="value">0</div></div>
            <div class="stat-box"><div class="title">Online HWID</div><div class="value">1</div></div>
        </div>

        <div class="navbar-dash">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('keys', this)"><i class="fa-solid fa-key"></i> KEYS DATABASE</button>
            </div>
            <div class="nav-actions">
                <button class="btn-action-sm" onclick="loadKeysFromTurso()"><i class="fa-solid fa-rotate"></i> SYNC DB</button>
                <button class="btn-action-sm logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> LOGOUT</button>
            </div>
        </div>

        <!-- Keys Tab -->
        <div id="tab-keys" class="view-panel active">
            <div class="keygen-bar">
                <div class="keygen-control"><label>Amount</label><input type="number" id="gen-amount" value="1" min="1" max="100"></div>
                <div class="keygen-control"><label>Duration</label><input type="number" id="gen-duration" value="30" min="1"></div>
                <div class="keygen-control"><label>Time Unit</label><select id="gen-unit"><option value="Days">Days</option><option value="Hours">Hours</option></select></div>
                <div class="keygen-control"><label>Devices</label><input type="number" id="gen-devices" value="1" min="1" max="10"></div>
                <div class="keygen-control"><label>Note</label><input type="text" id="gen-note" placeholder="VIP Client"></div>
                <div class="keygen-control"><label>Custom Key</label><input type="text" id="gen-custom" placeholder="KZIN-XXXX"></div>
                <div><button class="btn-generate" onclick="generateKey()">GENERATE</button></div>
            </div>

            <div class="filter-bar">
                <input type="text" class="search-input-box" placeholder="Search keys in Kzin Cheat database..." id="search-input" onkeyup="filterKeys()">
                <button class="btn-wipe" onclick="wipeKeys()">WIPE ALL</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 30px;"><input type="checkbox"></th>
                            <th>License Key</th>
                            <th>Note</th>
                            <th>Devices</th>
                            <th>Last Login</th>
                            <th>Expiry</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keys-table-body">
                        <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Loading from Kzin Cheat Turso Cluster...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast"><i class="fa-solid fa-circle-check" style="color: var(--cyan); font-size: 18px;"></i> <span id="toast-text">Success</span></div>

    <script>
        const TURSO_URL = "https://kzin-kzincheats123.aws-ap-northeast-1.turso.io";
        const TURSO_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTQ3ODkxMjcsImlkIjoiMDFhMWUxYzQtODQwMS03OWI5LWFmMDktZjk3NTljYjQwNWZmIiwia2lkIjoiaHNZMkhiSVVjOWdf__m6W8JWT13fNfZ5nWMmtqAgZSIXiFWdM";
        const TG_BOT_TOKEN = "9101381366:AAHHAnjYdp37XgHzvSyRi5Wtj-ZInAOX2NI";
        const CORRECT_PASSWORD = "Kzin@Madhu";

        async function sendTelegramNotification(title, details) {
            const chatId = "@kzin_cheat_alerts"; 
            const message = `🚨 *KZIN CHEAT // SYSTEM ALERT* 🚨\n\n📌 *Event:* ${title}\n📝 *Details:* ${details}\n⏰ *Time:* ${new Date().toLocaleString()}`;
            try {
                await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: "Markdown" })
                });
            } catch (err) { console.log("Telegram alert dispatched."); }
        }

        function triggerTelegramAlert(title, details) {
            sendTelegramNotification(title, details);
            showToast(`Alert Broadcasted: ${title}`);
        }

        function checkAutoLogin() {
            if (localStorage.getItem("kzin_logged_in") === "true") {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-app').style.display = 'block';
                initTursoTable();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const passwordInput = document.getElementById('access-code-input').value;
            if (passwordInput === CORRECT_PASSWORD) {
                localStorage.setItem("kzin_logged_in", "true");
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-app').style.display = 'block';
                initTursoTable();
                triggerTelegramAlert("Admin Login", "Authorized administrator logged into Kzin Cheat dashboard.");
            } else {
                showToast("Incorrect Password! Default is Kzin@Madhu");
            }
        }

        function handleLogout() {
            localStorage.removeItem("kzin_logged_in");
            document.getElementById('dashboard-app').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('access-code-input').value = CORRECT_PASSWORD;
        }

        let keysList = [];

        async function initTursoTable() {
            try {
                await fetch(`${TURSO_URL}/v2/pipeline`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${TURSO_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        requests: [{ type: "execute", stmt: { sql: "CREATE TABLE IF NOT EXISTS licenses (id INTEGER PRIMARY KEY AUTOINCREMENT, license_key TEXT UNIQUE NOT NULL, note TEXT, devices TEXT, last_login TEXT DEFAULT 'Not Activated', expiry TEXT NOT NULL, status TEXT DEFAULT 'Not Activated');" } }]
                    })
                });
                loadKeysFromTurso();
            } catch(err) { console.error("Turso init error:", err); }
        }

        async function loadKeysFromTurso() {
            try {
                const res = await fetch(`${TURSO_URL}/v2/pipeline`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${TURSO_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ requests: [{ type: "execute", stmt: { sql: "SELECT * FROM licenses ORDER BY id DESC" } }] })
                });
                const data = await res.json();
                const rows = data.results[0].response.result.rows;
                keysList = rows.map(r => ({
                    key: r[1].value,
                    note: r[2].value,
                    devices: r[3].value,
                    lastLogin: r[4].value,
                    expiry: r[5].value,
                    status: r[6].value
                }));
                renderKeys();
                showToast("Synced with Kzin Cheat Turso Cluster!");
            } catch(err) { console.error("Load error:", err); }
        }

        async function saveKeyToTurso(item) {
            await fetch(`${TURSO_URL}/v2/pipeline`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${TURSO_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    requests: [{ type: "execute", stmt: { sql: "INSERT INTO licenses (license_key, note, devices, expiry, status) VALUES (?, ?, ?, ?, ?)", args: [{type:"text", value:item.key}, {type:"text", value:item.note}, {type:"text", value:item.devices}, {type:"text", value:item.expiry}, {type:"text", value:item.status}] } }]
                })
            });
        }

        async function deleteKeyFromTurso(keyText) {
            await fetch(`${TURSO_URL}/v2/pipeline`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${TURSO_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ requests: [{ type: "execute", stmt: { sql: "DELETE FROM licenses WHERE license_key = ?", args: [{type:"text", value:keyText}] } }] })
            });
            loadKeysFromTurso();
            triggerTelegramAlert("Key Revoked", `License key ${keyText} was deleted.`);
            showToast("Key deleted from database");
        }

        async function wipeKeys() {
            if(confirm("Wipe all keys from Kzin Cheat database?")) {
                await fetch(`${TURSO_URL}/v2/pipeline`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${TURSO_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ requests: [{ type: "execute", stmt: { sql: "DELETE FROM licenses" } }] })
                });
                loadKeysFromTurso();
                triggerTelegramAlert("Database Wiped", "All keys purged from cluster.");
                showToast("Database wiped successfully");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        function renderKeys() {
            const tbody = document.getElementById('keys-table-body');
            tbody.innerHTML = keysList.length === 0 ? '<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">No license keys found.</td></tr>' : 
            keysList.map(item => `
                <tr>
                    <td><input type="checkbox"></td>
                    <td><span class="key-text">${item.key}</span></td>
                    <td>${item.note || '-'}</td>
                    <td><span class="badge-device">${item.devices}</span></td>
                    <td>${item.lastLogin}</td>
                    <td>${item.expiry}</td>
                    <td><span class="badge-status-dot"></span>${item.status}</td>
                    <td>
                        <div class="action-btn-group">
                            <button class="btn-table" onclick="showToast('Viewing ${item.key}')">VIEW</button>
                            <button class="btn-table danger" onclick="deleteKeyFromTurso('${item.key}')">DEL</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            document.getElementById('stat-total').innerText = keysList.length;
            document.getElementById('stat-active').innerText = keysList.length;
        }

        async function generateKey() {
            const amount = parseInt(document.getElementById('gen-amount').value) || 1;
            const duration = document.getElementById('gen-duration').value;
            const unit = document.getElementById('gen-unit').value;
            const devices = document.getElementById('gen-devices').value;
            const note = document.getElementById('gen-note').value;
            const custom = document.getElementById('gen-custom').value.trim();

            for(let i=0; i<amount; i++) {
                let generatedKey = custom ? (amount > 1 ? `${custom}-${i+1}` : custom) : `KZIN-${Math.random().toString(36).substring(2,6).toUpperCase()}-${Math.random().toString(36).substring(2,6).toUpperCase()}`;
                await saveKeyToTurso({ key: generatedKey, note: note || 'Generated', devices: `${devices} Device(s)`, expiry: `${duration} ${unit}`, status: 'Not Activated' });
            }
            loadKeysFromTurso();
            triggerTelegramAlert("Keys Generated", `${amount} new license key(s) generated.`);
            showToast(`${amount} key(s) generated successfully!`);
        }

        function filterKeys() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#keys-table-body tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
